services:
  server:
    build:
      context: .
    ports:
      - 8090:80
    volumes:
      - .:/var/www/html
      # Stop syncing the heavy dependency folders to your host!
      - /var/www/html/vendor
      - /var/www/html/node_modules
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  # Node service for Vite
  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # Isolate node_modules here as well
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    # Added --host so Vite is accessible outside the container
    command: sh -c "npm install && npm run dev -- --host"
        
  db:
    image: postgres:17
    restart: always
    env_file:
      - .env
    ports:
      - "7808:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=sg_review
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # New Web UI for PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
      
volumes:
  db-data: